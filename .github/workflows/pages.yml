name: Publish academic website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Markdown support
        run: python -m pip install -r requirements.txt
      - name: Read GitHub Pages configuration
        id: pages
        uses: actions/configure-pages@v5
      - name: Validate blog publishing behavior
        run: python -m unittest discover -s tests
      - name: Build website
        env:
          SITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: python generate.py
      - name: Check routes and local links
        env:
          SITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: python validate_site.py
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
